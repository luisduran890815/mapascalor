<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        h1 {
            font-size: 8vw; /* Escala según el ancho de la ventana */
            margin-top: 20px;
            background-color: #007BFF;
            color: white;
        }

        h2 {
            font-size: 4vw; /* También escalable */
            margin-top: 20px;
            background-color: #007BFF;
            color: white;
        }

        /* Ajustes específicos para pantallas pequeñas */
        @media (max-width: 768px) {
            h1 {
                font-size: 12vw; /* Más grande en móviles */
            }
            h2 {
                font-size: 6vw;
            }
        }

        .button-container {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap; /* Para que los botones no se salgan en móviles */
        }

        .btn {
            font-size: 1.2em;
            padding: 15px 30px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>

</head>
<body>
    <h1>Mapas de Calor</h1>
    <h2>Regional Norte</h2>


    <div class="button-container">
        <button onclick="window.open('MapaCalorBAQ.html', '_blank')" class="btn btn-primary">
                    Barranquilla
        </button>
        <button onclick="window.open('MapaCalorCTGA.html', '_blank')" class="btn btn-primary">
                    Cartagena
        </button>

        <button onclick="window.open('MapaCalorBUC.html', '_blank')" class="btn btn-primary">
                    Bucaramanga
        </button>

    </div>

</html>
